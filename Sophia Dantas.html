<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Word Croissant | Receita de croissant</title>

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #fff8fb;
        }

       
        header {
            background: linear-gradient(135deg, #e64997, #d92f82);
            border-bottom: 12px solid #eb7da1;
            padding: 20px 0;
        }

       
        .header-container {
            width: 960px;
            max-width: 90%;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        
        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
        }

        .logo-icon {
            font-size: 48px;
            margin-right: 12px;

            filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.15));
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .logo-name {
            font-family: 'DM Serif Display', serif;
            font-size: 38px;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            margin-top: 7px;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ecebec;
        }

        
        nav ul {
            display: flex;
            align-items: center;
            gap: 8px;

            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li a {
            display: block;

            padding: 10px 18px;

            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;

            border-radius: 25px;

            transition: all 0.3s ease;
        }

        
        nav li a:hover {
            background-color: #ffffff;
            color: #d92f82;

            transform: translateY(-2px);
        }

        
        nav li:first-child a {
            background-color: rgba(255, 255, 255, 0.18);
        }

        
        @media (max-width: 800px) {

            .header-container {
                flex-direction: column;
                gap: 25px;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo-name {
                font-size: 32px;
            }

            .logo-icon {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="header-container">

           
            <a href="#" class="logo">

                <span class="logo-icon">🥐</span>

                <span class="logo-text">
                    <span class="logo-name">
                        Word Croissant
                    </span>

                    <span class="logo-subtitle">
                        Croissant dos sonhos
                    </span>
                </span>

            </a>

            <!-- MENU -->
            <nav>
                <ul>

                    <li>
                        <a href="#">Home</a>
                    </li>

                    <li>
                        <a href="#">Sobre</a>
                    </li>

                    <li>
                        <a href="#">Receitas</a>
                    </li>

                    <li>
                        <a href="#">Promoções</a>
                    </li>

                </ul>
            </nav>

        </div>

    </header>

</body>
</html>
